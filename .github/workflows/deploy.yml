name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # a refresh trigger is not a code change; deploying on it queued in the shared 'pages'
    # group and GitHub cancelled the pending refresh run in favour of this one (2026-10-19)
    paths-ignore: ['.refresh-trigger']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
