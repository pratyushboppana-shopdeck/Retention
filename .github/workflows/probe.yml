name: One-off schema probe
# Temporary and read-only: runs only on pushes to the Claude working branch that touch the probe.
on:
  push:
    branches: [claude/sharp-heisenberg-sd2fbh]
    paths: ['.github/probe/**', '.github/workflows/probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe
        env:
          METABASE_URL: https://metabase.kaip.in
          METABASE_USER_EMAIL: ${{ secrets.METABASE_USER_EMAIL }}
          METABASE_PASSWORD: ${{ secrets.METABASE_PASSWORD }}
        run: python .github/probe/probe.py
